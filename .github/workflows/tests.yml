name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read
  checks: write

jobs:
  gdunit4:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: MikeSchulze/gdUnit4-action@v1
        with:
          godot-version: '4.7.2'
          version: 'installed'
          paths: 'res://tests'
